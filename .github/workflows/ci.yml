name: Build Orbit
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Editor frontend
        run: |
          npm --prefix src-tauri/editor ci
          npm --prefix src-tauri/editor run build
      - run: npm --prefix src-tauri/editor test
      - run: node --test
        working-directory: src-tauri/ui
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Executable starts and passes its self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath src-tauri	arget
elease\orbit-tauri.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)." }
      - uses: actions/upload-artifact@v5
        with:
          name: Orbit-windows-x64
          path: src-tauri/target/release/orbit-tauri.exe
