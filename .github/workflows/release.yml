name: Release Orbit 2
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Native lifecycle tests
        shell: powershell
        run: ./scripts/test-native.ps1
      - name: Updater transaction tests
        shell: powershell
        run: ./scripts/test-updater.ps1
      - run: npm run release
      - run: node scripts/smoke-packaged.cjs
      - name: Build installer
        shell: powershell
        run: ./scripts/build-installer.ps1
      - name: Installer smoke test
        shell: powershell
        run: |
          $orbitReleaseVersion = node -p "require('./package.json').version"
          $target = Join-Path $env:RUNNER_TEMP 'orbit-installer-test\Orbit'
          $setup = Start-Process -FilePath "release\Orbit2-Setup-$orbitReleaseVersion.exe" -ArgumentList '/silent', '/nolaunch', "/dir=$target" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installer failed.' }
          if ((Get-Content -Raw (Join-Path $target 'orbit-release.json') | ConvertFrom-Json).version -ne $orbitReleaseVersion) { throw 'Installer installed the wrong version.' }
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $orbitReleaseVersion = node -p "require('./package.json').version"
          gh release create "v$orbitReleaseVersion" "release/Orbit2-$orbitReleaseVersion-win32-x64.zip" "release/Orbit2-Setup-$orbitReleaseVersion.exe" "release/SHA256SUMS.txt" --verify-tag --title "Orbit 2 $orbitReleaseVersion" --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit "v$orbitReleaseVersion" --draft=false --latest
