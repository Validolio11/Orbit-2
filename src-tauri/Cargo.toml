[package]
name = "orbit-tauri"
version = "3.0.0"
edition = "2024"
description = "Orbit Tauri scaffold"
build = "build.rs"

# Keep the egui application's dependency graph and root build independent.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_HiDpi",
  "Win32_System_Registry", "Win32_Security", "Win32_System_Shutdown", "Win32_Storage_FileSystem", "Win32_UI_Shell_Common", "Win32_System_Diagnostics_Debug",
] }
